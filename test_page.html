<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFM Analysis Software</title>
</head>
<body>
    <h1>DFM Analysis Software</h1>
    <h2>Design for Manufacturing Analysis</h2>

    <h3>Upload STEP File</h3>

    <input type="file" id="stepFile" accept=".step,.stp">
    <br><br>

    <button onclick="analyzeFile()">Analyze STEP</button>

    <div id="status"></div>
    <div id="result"></div>

<script>
async function analyzeFile() {
    const fileInput = document.getElementById("stepFile");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    if (!fileInput.files.length) {
        status.innerHTML = "Please select a STEP file.";
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    status.innerHTML = "Analyzing...";

    try {
        const response = await fetch("/analyze-step", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Analysis failed");
        }

        result.innerHTML = `
            <h2>Analysis Completed</h2>
            <p>DFM Score: ${data.dfm_score.score}/100</p>
            <p>Total Checks: ${data.dfm_score.total_checks}</p>
            <p>Passed: ${data.dfm_score.passed}</p>
            <p>Warnings: ${data.dfm_score.warning}</p>
            <p>Critical: ${data.dfm_score.critical}</p>
            <a href="/download-report/${encodeURIComponent(data.pdf_report.filename)}" target="_blank">
                Download PDF Report
            </a>
        `;

        status.innerHTML = "Analysis completed successfully.";

    } catch (error) {
        status.innerHTML = "Error: " + error.message;
    }
}
</script>

</body>
</html>
